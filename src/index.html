<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XATURNO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="canvas-background"></canvas>

    <div class="container">
        <img src="images/love.jpg" alt="Featured Image" class="centered-img">

        <span class="badge">Cloud Infrastructure</span>
        <h1>XATURNO</h1>
        <p class="subtitle">JUAN LUIS MARQUEZ</p>
        
        <div class="status-pill">
            <span class="dot"></span>
            <span>All Systems Operational</span>
        </div>

        <!-- Live Host Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">CPU Usage</span>
                <span class="stat-value" id="cpu-val">--%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">RAM Usage</span>
                <span class="stat-value" id="ram-val">-- / --</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Disk Free</span>
                <span class="stat-value" id="disk-val">-- GB</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Uptime</span>
                <span class="stat-value" id="uptime-val">--</span>
            </div>
        </div>
    </div>

    <script src="js/background.js"></script>
    <script src="js/stats.js"></script>
</body>
</html>
