name: Deploy to OCI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Caddyfile'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add OCI Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Web Content to OCI
        run: |
          # 1. Sync static site files from ./src/ to target web root
          rsync -avz --delete ./src/ ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/var/www/oci_web_server/

          # 2. Copy production Caddyfile to target
          rsync -avz ./Caddyfile ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/var/www/oci_web_server/Caddyfile

      - name: Reload Caddy Service
        run: |
          ssh ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }} "sudo systemctl reload caddy"

      - name: Configure Automated Stats Cron Job
        run: |
          ssh ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }} '
            chmod +x /var/www/oci_web_server/update-stats.sh

            CRON_JOB="* * * * * /var/www/oci_web_server/update-stats.sh > /dev/null 2>&1"

            # Idempotently update user crontab without creating duplicates
            (crontab -l 2>/dev/null | grep -Fv "update-stats.sh" || true; echo "$CRON_JOB") | crontab -

            # Run once immediately so stats.json exists right away
            /var/www/oci_web_server/update-stats.sh
          '