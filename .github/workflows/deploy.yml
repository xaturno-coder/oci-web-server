name: Deploy Native Caddy Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Web Content to OCI
        run: |
          rsync -avz --delete ./src/ ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/var/www/oci_web_server/

      - name: Sync Caddyfile & Reload Caddy Service
        run: |
          rsync -avz ./Caddyfile ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/etc/caddy/Caddyfile
          ssh ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }} "sudo systemctl reload caddy"