name: Deploy to OCI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Caddyfile'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add OCI Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Web Content to OCI
        run: |
          # 1. Sync static site files from ./src/ to target web root, preserving production stats.json
          rsync -avz --delete --exclude 'stats.json' ./src/ ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/var/www/oci_web_server/

          # 2. Copy production Caddyfile to target
          rsync -avz ./Caddyfile ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:/var/www/oci_web_server/Caddyfile

      - name: Execute Post-Deployment Tasks
        run: |
          ssh ${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }} 'bash -s' < scripts/post-deploy.sh